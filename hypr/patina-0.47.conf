# Patina for Hyprland 0.47 and older (hyprland.conf). Include it at the end of your config with
# the path to your clone, for example:
#   source = ~/code/patina/hypr/patina-0.47.conf

# Double Shift captures the selection (r = on release, n = the key is not consumed).
bindrn = SHIFT, Shift_L, exec, ~/.local/bin/patina tap
bindrn = SHIFT, Shift_R, exec, ~/.local/bin/patina tap
bind = SUPER, C, exec, ~/.local/bin/patina

windowrulev2 = float, class:^(io\.github\.lautarosegura\.Patina)$
windowrulev2 = size 560 680, class:^(io\.github\.lautarosegura\.Patina)$
windowrulev2 = center, class:^(io\.github\.lautarosegura\.Patina)$

exec-once = ~/.local/bin/patina --service
