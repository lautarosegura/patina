# Patina for Hyprland 0.47 and older (hyprland.conf). Include it at the end of your config, for
# example with the copy the .deb and .rpm packages install:
#   source = /usr/lib/Patina/hypr/patina-0.47.conf

# Double Shift captures the selection (r = on release, n = the key is not consumed).
bindrn = SHIFT, Shift_L, exec, patina tap
bindrn = SHIFT, Shift_R, exec, patina tap
bind = SUPER, C, exec, patina

windowrulev2 = float, class:^(patina)$
windowrulev2 = size 560 680, class:^(patina)$
windowrulev2 = center, class:^(patina)$

exec-once = patina --service
