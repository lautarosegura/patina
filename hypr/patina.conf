# Patina en Hyprland con hyprland.conf (hyprlang). Sin probar: la configuración probada es la de
# patina.lua. Incluilo con la ruta a tu clon del repo, por ejemplo:
#   source = ~/code/patina/hypr/patina.conf

# Doble Shift captura la selección (r = al soltar, n = no consume la tecla).
bindrn = SHIFT, Shift_L, exec, ~/.local/bin/patina tap
bindrn = SHIFT, Shift_R, exec, ~/.local/bin/patina tap
bind = SUPER, C, exec, ~/.local/bin/patina

windowrule = float, class:^(io\.github\.lautarosegura\.Patina)$
windowrule = size 560 680, class:^(io\.github\.lautarosegura\.Patina)$
windowrule = center, class:^(io\.github\.lautarosegura\.Patina)$

exec-once = ~/.local/bin/patina --service
