# Patina for Hyprland 0.53 and 0.54 (hyprland.conf). Include it at the end of your config with
# the path to your clone, for example:
#   source = ~/code/patina/hypr/patina.conf
# Other versions: patina.lua (0.55+), patina-0.48.conf (0.48–0.52), patina-0.47.conf (older).

# Double Shift captures the selection (r = on release, n = the key is not consumed).
bindrn = SHIFT, Shift_L, exec, ~/.local/bin/patina tap
bindrn = SHIFT, Shift_R, exec, ~/.local/bin/patina tap
bind = SUPER, C, exec, ~/.local/bin/patina

windowrule = float on, size 560 680, center on, match:class ^(io\.github\.lautarosegura\.Patina)$

exec-once = ~/.local/bin/patina --service
