<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>Patina</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top" data-tauri-drag-region>
    <button id="back" class="round-button" type="button" title="Volver a la cola (Ctrl+1)" aria-label="Volver a la cola" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <label id="search-wrap" class="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Buscar" aria-label="Buscar" autocomplete="off" spellcheck="false">
    </label>
    <h1 id="view-title" class="view-title" data-tauri-drag-region hidden>Notas</h1>
    <button id="menu-button" class="round-button" type="button" aria-label="Menú" aria-haspopup="menu" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg></button>
    <div id="menu" class="menu" role="menu" aria-label="Menú" hidden>
      <button class="menu-item" role="menuitemradio" data-view="queue">Cola<kbd>Ctrl+1</kbd></button>
      <button class="menu-item" role="menuitemradio" data-view="notes">Notas<kbd>Ctrl+2</kbd></button>
      <button class="menu-item" role="menuitemradio" data-view="history">Historial<kbd>Ctrl+3</kbd></button>
      <div class="menu-separator" role="separator"></div>
      <button id="clear-done" class="menu-item" role="menuitem">Borrar completados<kbd>Ctrl+Shift+Retroceso</kbd></button>
      <div class="menu-separator" role="separator"></div>
      <div class="menu-label">Tema</div>
      <button class="menu-item" role="menuitemradio" data-theme="system">Sistema</button>
      <button class="menu-item" role="menuitemradio" data-theme="light">Claro</button>
      <button class="menu-item" role="menuitemradio" data-theme="dark">Oscuro</button>
      <div class="menu-separator" role="separator"></div>
      <button id="close" class="menu-item" role="menuitem">Ocultar<kbd>Esc</kbd></button>
    </div>
  </header>
  <main>
    <section id="queue" class="panel" aria-label="Cola">
      <div id="queue-scroller" class="scroller"><div id="queue-list" class="list" role="listbox" aria-label="Cola"></div><p id="queue-no-match" class="no-match" hidden>Nada coincide con la búsqueda.</p></div>
      <div id="queue-empty" class="empty" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m 7 0 c -0.554688 0 -1 0.445312 -1 1 h -2 c -1.644531 0 -3 1.355469 -3 3 v 9 c 0 1.644531 1.355469 3 3 3 h 8 c 1.644531 0 3 -1.355469 3 -3 v -9 c 0 -1.644531 -1.355469 -3 -3 -3 h -2 c 0 -0.554688 -0.445312 -1 -1 -1 z m -3 3 h 1 v 1 c 0 0.554688 0.445312 1 1 1 h 4 c 0.554688 0 1 -0.445312 1 -1 v -1 h 1 c 0.570312 0 1 0.429688 1 1 v 9 c 0 0.570312 -0.429688 1 -1 1 h -8 c -0.570312 0 -1 -0.429688 -1 -1 v -9 c 0 -0.570312 0.429688 -1 1 -1 z m 0 0" fill="currentColor"/></svg><h1>Nada en la cola</h1><p>Seleccioná texto en cualquier app y tocá Shift dos veces.<br>O escribí tus próximos prompts acá arriba.</p></div>
      <div class="composer">
        <span class="circle" aria-hidden="true"></span>
        <textarea id="prompt-entry" rows="1" placeholder="Agregá una nota o un prompt" aria-label="Agregá una nota o un prompt" autocomplete="off" spellcheck="false"></textarea>
      </div>
    </section>
    <section id="notes" class="panel" aria-label="Notas" hidden><textarea id="notes-text" aria-label="Notas" spellcheck="false"></textarea></section>
    <section id="history" class="panel" aria-label="Historial" hidden>
      <div id="history-scroller" class="scroller"><div id="history-list" class="list" role="listbox" aria-label="Historial"></div><p id="history-no-match" class="no-match" hidden>Nada coincide con la búsqueda.</p></div>
      <div id="history-empty" class="empty" hidden><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-width="5"/><path d="M29 15h5v17h13v5H29z"/></svg><h1>Historial vacío</h1><p>Lo que limpies o borres de la cola queda guardado acá.</p></div>
    </section>
  </main>
</body>
</html>
